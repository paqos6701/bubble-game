<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>비눗방울 터뜨리기</title>
<style>
  :root {
    --left: #2f8cff;
    --right: #ff4d6d;
    --gold: #ffc531;
    --ink: #17324d;
    --panel: rgba(255, 255, 255, 0.92);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1e33; color: var(--ink);
    font-family: "Samsung Sans", "SamsungOneKorean", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; }
  #cam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); background: #0b1e33; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; }

  /* 설정 화면 (어른이 터치) */
  #setup { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, rgba(120, 200, 255, 0.55), rgba(255, 180, 220, 0.55)); }
  .card { background: var(--panel); border-radius: 28px; padding: 22px 28px; width: min(92vw, 720px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25); text-align: center; }
  h1 { margin: 0 0 6px; font-size: clamp(26px, 5vh, 42px); letter-spacing: -1px; }
  .sub { margin: 0 0 14px; font-size: clamp(13px, 2.4vh, 17px); color: #4b6178; }
  .row { display: flex; gap: 12px; justify-content: center; margin: 10px 0; flex-wrap: wrap; align-items: center; }
  .label { font-weight: 700; font-size: clamp(14px, 2.6vh, 18px); min-width: 72px; }
  button { font: inherit; border: 0; border-radius: 18px; cursor: pointer; }
  .opt { padding: 12px 22px; font-size: clamp(16px, 3vh, 22px); font-weight: 700; background: #e6eef6; color: #4b6178; }
  .opt.on { background: var(--ink); color: #fff; }
  .opt.l.on { background: var(--left); }
  .opt.r.on { background: var(--right); }
  #startBtn { margin-top: 14px; padding: 16px 60px; font-size: clamp(20px, 4vh, 30px); font-weight: 800;
    background: linear-gradient(135deg, #36c2ff, #8a5cff); color: #fff; box-shadow: 0 6px 18px rgba(80, 90, 255, 0.4); }
  #msg { margin-top: 10px; min-height: 1.2em; color: #c0392b; font-size: 15px; }
  .hidden { display: none !important; }

  /* 게임 중 작은 버튼 (어른용) */
  #homeBtn { position: fixed; right: 12px; bottom: 12px; padding: 8px 14px; font-size: 14px;
    background: rgba(0, 0, 0, 0.35); color: #fff; border-radius: 12px; }
</style>
</head>
<body>
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="fx"></canvas>

  <div id="setup">
    <div class="card">
      <h1>🫧 비눗방울 터뜨리기</h1>
      <p class="sub">카메라 앞에서 손, 발, 머리… 몸 어디로든 방울을 터뜨려요! (1분)</p>

      <div class="row">
        <span class="label">인원</span>
        <button class="opt on" data-players="1">1인</button>
        <button class="opt" data-players="2">2인 대결</button>
      </div>

      <div class="row" id="diff1">
        <span class="label">난이도</span>
        <button class="opt on" data-diff="s:easy">쉬움</button>
        <button class="opt" data-diff="s:normal">보통</button>
      </div>

      <div class="row hidden" id="diff2">
        <span class="label" style="color:var(--left)">왼쪽</span>
        <button class="opt l on" data-diff="l:easy">쉬움</button>
        <button class="opt l" data-diff="l:normal">보통</button>
        <span style="width:18px"></span>
        <span class="label" style="color:var(--right)">오른쪽</span>
        <button class="opt r" data-diff="r:easy">쉬움</button>
        <button class="opt r on" data-diff="r:normal">보통</button>
      </div>

      <button id="startBtn">시작</button>
      <div id="msg"></div>
    </div>
  </div>

  <button id="homeBtn" class="hidden">⚙ 설정</button>

  <script src="mp/selfie_segmentation.js"></script>
  <script src="game.js"></script>
</body>
</html>
